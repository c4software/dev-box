# Local overrides, specific to this machine (not tracked by git):
#   cp compose.override.example.yaml compose.override.yaml
# Docker Compose merges it with compose.yaml automatically.
# Empty by default: uncomment what you need.

services:
  dev-box:
    # Extra volumes (added to the ones from compose.yaml)
    # volumes:
    #   - /srv/partage:/home/dev/partage
    #
    # Resource limits
    # mem_limit: 8g
    # cpus: 4
    #
    # Rootless podman inside the box (docker run/build/compose with no host
    # socket). Turned on with PODMAN_ENABLE=true in .env. Found by trial,
    # starting from nothing and adding only what unblocked something:
    #   - /dev/fuse: fuse-overlayfs, podman's image storage;
    #   - seccomp: the default Docker profile refuses clone(CLONE_NEWUSER), and
    #     podman stops on "cannot clone: Operation not permitted";
    #   - systempaths: Docker mounts /proc/sys read-only, crun cannot write
    #     net.ipv4.ping_group_range nor netavark route_localnet, so no container
    #     starts and no port is published;
    #   - apparmor: no effect on a host without AppArmor, required where it is
    #     active (Debian, Raspberry Pi OS).
    # No --privileged and no CAP_SYS_ADMIN. The price: the isolation of the box
    # itself is loosened (a container-to-host escape is easier).
    # devices:
    #   - /dev/net/tun
    #   - /dev/fuse
    # security_opt:
    #   - seccomp=unconfined
    #   - systempaths=unconfined
    #   - apparmor=unconfined
