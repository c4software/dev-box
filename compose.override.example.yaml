# Local overrides, specific to this machine (not tracked by git):
#   cp compose.override.example.yaml compose.override.yaml
# Docker Compose merges it with compose.yaml automatically.
# Empty by default: uncomment what you need.

services:
  dev-box:
    # Extra volumes (added to the ones from compose.yaml)
    # volumes:
    #   - /srv/partage:/home/dev/partage
    #
    # Resource limits
    # mem_limit: 8g
    # cpus: 4
    #
    # Rootless podman inside the box (docker run/build/compose with no host
    # socket). Turned on with PODMAN_ENABLE=true in .env. Found by trial,
    # starting from nothing and adding only what unblocked something:
    #   - /dev/fuse: fuse-overlayfs, podman's image storage;
    #   - seccomp: the default Docker profile refuses clone(CLONE_NEWUSER), and
    #     podman stops on "cannot clone: Operation not permitted";
    #   - systempaths: Docker mounts /proc/sys read-only, crun cannot write
    #     net.ipv4.ping_group_range nor netavark route_localnet, so no container
    #     starts and no port is published;
    #   - apparmor: no effect on a host without AppArmor, required where it is
    #     active (Debian, Raspberry Pi OS).
    # No --privileged and no CAP_SYS_ADMIN. The price: the isolation of the box
    # itself is loosened (a container-to-host escape is easier).
    # devices:
    #   - /dev/net/tun
    #   - /dev/fuse
    # security_opt:
    #   - seccomp=unconfined
    #   - systempaths=unconfined
    #   - apparmor=unconfined
    #
    # GPU of the host (Intel, AMD, the Raspberry Pi's): hardware video
    # decoding and encoding (ffmpeg -hwaccel vaapi), OpenGL and Vulkan.
    # The entrypoint adds the user to the group that owns /dev/dri, whatever
    # its GID on the host; the drivers come with `devbox gpu install`. NVIDIA
    # goes through the NVIDIA Container Toolkit instead. The host must have a
    # /dev/dri (not Docker Desktop on macOS), or the container does not start.
    # With the podman block, add /dev/dri to its devices list instead: a
    # second devices key would be refused.
    # devices:
    #   - /dev/dri
    #
    # An iPhone or iPad plugged into the host, for `devbox dev-env ios`: the
    # USB bus as a volume, so that a device plugged in after the start shows
    # up too (a devices entry would freeze the list at start), and the cgroup
    # rule that lets the box open USB devices (character major 189). The box
    # runs no udev and no systemd: start the daemon by hand, once the device
    # is plugged in and unlocked, with `devbox pkg add usbmuxd` then
    # `sudo usbmuxd`; `xtool devices` lists it once "Trust" is answered on its
    # screen. Stop a usbmuxd running on the host first, the device has one
    # owner. The whole bus is given: every USB device of the host is within
    # reach of the box. A device plugged into another machine than this
    # host needs none of this: `devbox help ios-usb` in the box.
    # volumes:
    #   - /dev/bus/usb:/dev/bus/usb
    # device_cgroup_rules:
    #   - 'c 189:* rmw'
