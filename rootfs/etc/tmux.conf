# System tmux config of the box, read before ~/.config/tmux/tmux.conf.
# The dotfiles own the user config and `devbox sync` rewrites it, so what the
# box adds lives here: a reload of the user config keeps these bindings.

# prefix + a: menu of the Herdr agents of the box, each line opens or closes
# the agent in a tmux window of its own (dev-box-herdr)
bind a run-shell "dev-box-herdr menu '#{client_name}'"
