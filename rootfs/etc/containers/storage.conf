# Stockage des images podman dans la box. Pas de fichier .d pour storage.conf :
# celui-ci remplace celui de containers-common.
#
# La box est elle-même un conteneur Docker posé sur overlayfs : overlay natif ne
# sait pas s'empiler sur un overlay en rootless. fuse-overlayfs marche partout,
# au prix d'un peu de débit sur les gros I/O.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
