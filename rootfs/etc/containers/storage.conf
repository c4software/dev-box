# Where podman keeps its images inside the box. storage.conf has no .d drop-in,
# so this file replaces the one from containers-common.
#
# The box is itself a Docker container sitting on overlayfs, and native overlay
# cannot always stack on an overlay when rootless. fuse-overlayfs works
# everywhere, at the cost of some throughput on heavy I/O.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
