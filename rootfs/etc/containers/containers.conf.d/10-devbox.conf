# Surcharges de la box (drop-in : les valeurs de containers-common restent).
[engine]
# Pas de systemd ici (PID 1 = entrypoint.sh) : ni cgroups délégués, ni journald.
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
# `podman compose` doit trouver le plugin compose v2 livré par le paquet
# docker-compose ; `docker compose` passe lui par le shim podman-docker.
compose_providers = ["/usr/lib/docker/cli-plugins/docker-compose"]
