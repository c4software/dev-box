# Box overrides (drop-in: the containers-common values are kept).
[engine]
# No systemd here (PID 1 is entrypoint.sh): no delegated cgroups, no journald.
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
# `podman compose` has to find the compose v2 plugin shipped by the
# docker-compose package. `docker compose` goes through the podman-docker shim.
compose_providers = ["/usr/lib/docker/cli-plugins/docker-compose"]
