# dev-box: the application launcher of `devbox desktop`, fuzzel. It lists the
# apps of the box and runs for as long as it is on screen. Your own goes in
# ~/.config/dev-box/desktop/fuzzel.ini and replaces this file as a whole.

[main]
font=monospace:size=14
prompt="> "
placeholder=Search the apps of the box
icon-theme=hicolor
terminal=foot -e
# Every app starts through dev-box-desktop run, which adds the options a
# container needs to the ones it knows (Chromium, VS Code).
launch-prefix=dev-box-desktop run
layer=overlay
width=44
lines=8
horizontal-pad=20
vertical-pad=16
inner-pad=10

# The colours of the wallpaper.
[colors]
background=0b1020e6
text=e5e9f5ff
prompt=2dd4bfff
placeholder=9fb3d9aa
input=e5e9f5ff
match=2dd4bfff
selection=e5e9f526
selection-text=e5e9f5ff
selection-match=2dd4bfff
border=2dd4bf88

[border]
width=1
radius=18
