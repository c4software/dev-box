# dev-box: the Hyprland of `devbox desktop`, a session with no screen of its
# own, shown by gliff on a private one. Kept bare: no bar, no launcher, no
# animation. Your own goes in ~/.config/dev-box/desktop/hyprland.conf and
# replaces this file as a whole.

monitor = , preferred, auto, 1

general {
  gaps_in = 2
  gaps_out = 4
  border_size = 1
}

animations {
  enabled = false
}

decoration {
  blur {
    enabled = false
  }
  shadow {
    enabled = false
  }
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

# Nothing in the box needs X11.
xwayland {
  enabled = false
}

# The browser when the box has one (devbox dev-env browser), a terminal
# otherwise.
exec-once = dev-box-desktop autostart

$mod = SUPER
bind = $mod, Return, exec, foot
bind = $mod, B, exec, dev-box-desktop browser
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
