# Dev tools managed by mise in the home (persistent, independent of the image).
# System packages come from pacman.
# Same idea as omarchy-install-dev-env: `mise use -g go@latest`, `mise use -g python@latest`.
# `dev-box-dev-env` (or `devbox dev-env`) adds whole environments here.

[tools]
node = "lts"
# shellcheck: the lint every script of the repo must pass (aqua backend,
# release binaries for x86_64 and aarch64).
shellcheck = "latest"

# Coding agents: same names as the wrappers in /usr/local/bin (claude, pi, omp,
# codex; opencode too, but installed only on the first call), which run a
# `mise use -g <tool>` on the fly when the tool is missing.
claude = "latest"
pi = "latest"
codex = "latest"

# omp: mise's github backend picks the release asset for the OS and the
# architecture (omp-linux-x64 on amd64, omp-linux-arm64 on arm64). Nothing to
# set for the Raspberry Pi.
"github:can1357/oh-my-pi" = "latest"   # omp
