# Build the image and publish it on ghcr.io/<owner>/dev-box.
#
# One native build per architecture (amd64 and arm64 runners, no qemu), each
# pushed by digest, then a single multi-arch manifest, always tagged latest
# and nothing else. Every build starts from a fresh base image with no layer
# cache, exactly like `just rebuild`: an Arch image built from a cached pacman
# layer would carry packages frozen at the first build.
#
# Only a v* tag builds. A push on main publishes nothing, so a release is a
# deliberate act (git tag -a v0.3.0 && git push origin v0.3.0), and a box
# pulls it only when its owner runs `just pull`. The image records its tag,
# and dev-box-check-updates compares it with the newest v* tag of the repo.
#
# Once the image is out, the tag becomes a GitHub release whose notes are the
# annotation of the tag: that is the changelog `devbox changelog` shows in the
# box. Write it when tagging, `git tag -a v1.7` opens the editor.
name: Build the image

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build args feed /etc/devbox/release, which dev-box-check-updates
      # compares with the remote repo. A tag is not a branch to follow, so the
      # release records main; DEVBOX_SOURCE=release makes the box compare
      # itself with the newest v* tag instead, the next image it can pull.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          build-args: |
            DEVBOX_COMMIT=${{ github.sha }}
            DEVBOX_REPO=${{ github.server_url }}/${{ github.repository }}.git
            DEVBOX_BRANCH=main
            DEVBOX_VERSION=${{ github.ref_name }}
            DEVBOX_SOURCE=release
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest, tagged latest
        working-directory: /tmp/digests
        run: |
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create -t "${IMAGE}:latest" "${refs[@]}"

      - name: Inspect the result
        run: docker buildx imagetools inspect "${IMAGE}:latest"

  release:
    name: Publish the release notes
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # checkout leaves a lightweight copy of the tag: fetch the annotated one.
      # Subject and body, without a signature; a lightweight tag gives the
      # message of its commit.
      - name: Read the annotation of the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > /tmp/notes.md
          cat /tmp/notes.md

      # Created once, edited on a re-run: the notes follow the tag.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
          fi
