# Build the amd64 image and publish it on ghcr.io/<owner>/dev-box, as latest
# and under the release tag (v1.12).
#
# The arm64 image (Raspberry Pi 5, Apple silicon) is another image, with its
# own tags (latest-arm64, v1.12-arm64), built on demand only: build-arm64.yml,
# by pushing a v1.12-arm tag, from the Actions tab or
# `gh workflow run build-arm64.yml -f ref=v1.12`. The
# two are not merged into one multi-arch manifest: each box names the image of
# its machine in DEVBOX_IMAGE (setup.sh picks it from uname -m).
#
# Every build starts from a fresh base image with no layer cache, exactly like
# `docker compose build --pull --no-cache`: an Arch image built from a cached
# pacman layer would carry packages frozen at the first build. The image is a
# single layer (FROM scratch at the end of the Dockerfile), pushed compressed
# with zstd rather than gzip: smaller to pull, and every Docker from 23 on and
# podman read it.
#
# Only a v* tag builds. A push on main publishes nothing, so a release is a
# deliberate act (git tag -a v0.3.0 && git push origin v0.3.0), and a box
# pulls it only when its owner pulls the image and restarts the container.
# The image records its tag, and dev-box-check-updates compares it with the
# newest v* tag of the repo.
#
# Once the image is out, the tag becomes a GitHub release whose notes are the
# annotation of the tag: that is the changelog `devbox changelog` shows in the
# box. Write it when tagging, `git tag -a v1.7` opens the editor.
name: Build the image

on:
  push:
    # v1.12-arm is not a release: it only triggers build-arm64.yml.
    tags: ["v*", "!v*-arm"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build args feed /etc/devbox/release, which dev-box-check-updates
      # compares with the remote repo. A tag is not a branch to follow, so the
      # release records main; DEVBOX_SOURCE=release makes the box compare
      # itself with the newest v* tag instead, the next image it can pull.
      # DEVBOX_IMAGE_NAME and an empty DEVBOX_TAG_SUFFIX say which image this
      # is, so the box names it when it says what to pull.
      #
      # zstd level 19: buildkit maps every level from 10 up to the best
      # setting of its zstd encoder. Measured on amd64: 649 MB in gzip, 596 MB
      # at zstd 3, 523 MB at 19, for about the time gzip takes (two minutes
      # on a laptop, next to a build of ten or more). force-compression
      # recompresses the layer even if buildkit had it in gzip already.
      #
      # provenance keeps the pushed tag an image index (the image plus its
      # attestation) rather than a bare manifest: an arm64 host that pulls
      # latest is then refused with "no matching manifest for linux/arm64"
      # instead of getting the amd64 image, which would not start.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          provenance: mode=min
          build-args: |
            DEVBOX_COMMIT=${{ github.sha }}
            DEVBOX_REPO=${{ github.server_url }}/${{ github.repository }}.git
            DEVBOX_BRANCH=main
            DEVBOX_VERSION=${{ github.ref_name }}
            DEVBOX_SOURCE=release
            DEVBOX_IMAGE_NAME=${{ env.IMAGE }}
            DEVBOX_TAG_SUFFIX=
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          outputs: type=registry,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true

      - name: Inspect the result
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"

  release:
    name: Publish the release notes
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # checkout leaves a lightweight copy of the tag: fetch the annotated one.
      # Subject and body, without a signature; a lightweight tag gives the
      # message of its commit.
      - name: Read the annotation of the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > /tmp/notes.md
          cat /tmp/notes.md

      # Created once, edited on a re-run: the notes follow the tag.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
          fi
