services:
  dev-box:
    build:
      context: .
      # Commit du dépôt gravé dans l'image (/etc/devbox/release) : le contrôle
      # des mises à jour dans la box compare avec le dépôt distant. Renseignés
      # par le justfile ; « unknown » avec un docker compose build direct.
      args:
        DEVBOX_COMMIT: ${DEVBOX_COMMIT:-unknown}
        DEVBOX_REPO: ${DEVBOX_REPO:-}
        DEVBOX_BRANCH: ${DEVBOX_BRANCH:-main}
    container_name: dev-box
    hostname: ${TS_HOSTNAME:-dev-box}
    init: true
    restart: unless-stopped
    env_file: .env
    # Sert uniquement quand TS_DISABLE=true (sshd) ; sans listener, le port est
    # simplement fermé. Par défaut lié à la loopback de l'hôte.
    ports:
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT:-2222}:22"
    volumes:
      - ./data/home:/home/${USER_NAME:-dev}
      - ${PROJECTS_DIR:-./data/projets}:/home/${USER_NAME:-dev}/projets
      - ./data/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
