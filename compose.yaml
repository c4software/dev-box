services:
  dev-box:
    build:
      context: .
      # Repo commit baked into the image (/etc/devbox/release): the update
      # check inside the box compares it with the remote repo. Set by the
      # justfile; left empty, the Dockerfile reads them from the clone itself.
      args:
        DEVBOX_COMMIT: ${DEVBOX_COMMIT:-}
        DEVBOX_REPO: ${DEVBOX_REPO:-}
        DEVBOX_BRANCH: ${DEVBOX_BRANCH:-}
    container_name: dev-box
    hostname: ${TS_HOSTNAME:-dev-box}
    init: true
    restart: unless-stopped
    env_file: .env
    # Only used when TS_DISABLE=true (sshd); with no listener the port is
    # simply closed. Bound to the host loopback by default.
    ports:
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT:-2222}:22"
    volumes:
      - ./data/home:/home/${USER_NAME:-dev}
      - ${PROJECTS_DIR:-./data/projets}:/home/${USER_NAME:-dev}/projets
      - ./data/tailscale:/var/lib/tailscale
    devices:
      # /dev/net/tun: tailscaled (userspace networking is off)
      - /dev/net/tun
    cap_add:
      # tailscaled: tun interface, routes, filtering
      - NET_ADMIN
      - NET_RAW
    # Rootless podman inside the box: off by default, because it forces the
    # isolation of the container open (seccomp, /proc/sys, AppArmor). Settings
    # and explanations in compose.override.example.yaml, turned on with
    # PODMAN_ENABLE=true in .env.
